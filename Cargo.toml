[package]
name = "cogrs"
version = "0.2.0"
edition = "2024"
description = "Tools for creating COG-based tilers"
license = "MIT"
repository = "https://github.com/evanjt/cogrs"
documentation = "https://docs.rs/cogrs"
homepage = "https://github.com/evanjt/cogrs"
readme = "README.md"
keywords = ["cog", "geotiff", "tiff", "raster", "geo"]
categories = ["science::geo", "encoding"]

[lib]
name = "cogrs"
path = "src/lib.rs"
# The lib has no benches; without this, `cargo bench -- <criterion flags>` is
# also passed to libtest, which rejects them.
bench = false

[dependencies]
# TIFF/image parsing
tiff = { version = "0.10.3", features = ["lzw", "deflate"], default-features = false }
image = "0.25.6"

# Compression
weezl = "0.1.10"
flate2 = { version = "1.0", default-features = false, features = ["zlib-rs"] }
zstd = "0.13"

# Coordinate transforms
geo = "0.31.0"
proj4rs = { version = "0.1.9", features = ["crs-definitions"] }  # Pure Rust with EPSG database
crs-definitions = "0.3.1"  # EPSG -> PROJ4 string lookups

# Data structures
ndarray = "0.16.1"
bytes = "1.5.0"
lru = "0.12"
ahash = "0.8"  # Faster HashMap lookups

# Async/storage
tokio = { version = "1.44.2", features = ["rt", "rt-multi-thread", "fs", "sync", "time"] }
object_store = { version = "0.12.3", features = ["http", "aws"] }
futures = "0.3"
parking_lot = "0.12"

# Error handling and utilities
anyhow = "1.0.98"
thiserror = "2.0"
tracing = "0.1"
once_cell = "1.19.0"
url = "2.5.7"
walkdir = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }  # conditional-request timestamps (already used by object_store)

[features]
default = []
# Enable S3 support
s3 = []

[dev-dependencies]
tempfile = "3.19.1"
tokio = { version = "1.44.2", features = ["full", "test-util"] }
rand = "0.9"
criterion = { version = "0.6", features = ["html_reports"] }
tiff = "0.10.3"
gdal = { git = "https://github.com/georust/gdal", features = ["bindgen"] }  # Using git for GDAL 3.12 support

[[bench]]
name = "tile_extraction"
harness = false

# Applies only when this crate is the build root (benches, examples, tests), not when
# it is a dependency of another crate.
[profile.release]
lto = "fat"
codegen-units = 1
