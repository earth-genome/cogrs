name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    runs-on: ubuntu-24.04
    container: ghcr.io/osgeo/gdal:ubuntu-small-3.12.2
    steps:
      # The GDAL image already has curl, unzip, python3+osgeo and the GDAL headers. Added:
      # build-essential (cc/linker), libclang-dev + pkg-config (gdal-sys bindgen), git (cargo git dep).
      - name: Install build deps
        run: |
          apt-get update -o Acquire::Retries=3
          apt-get install -y --no-install-recommends -o Acquire::Retries=3 build-essential libclang-dev pkg-config git
      - uses: actions/checkout@v7
      # Pinned: newer stable clippy adds lints (e.g. chunks_exact_to_as_chunks) that the
      # codebase hasn't been migrated to yet.
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-24.04
    container: ghcr.io/osgeo/gdal:ubuntu-small-3.12.2
    steps:
      # The apt GDAL on ubuntu-24.04 is 3.8 and its Deflate output differs byte-for-byte from
      # 3.12, which breaks the golden fixture layout hashes; use the official 3.12 image
      # (ships headers, gdal_translate and python3 osgeo).
      - name: Install build deps and fixture tools
        run: |
          apt-get update -o Acquire::Retries=3
          apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            build-essential libclang-dev pkg-config git libtiff-tools python3-numpy
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache test fixtures
        uses: actions/cache@v6
        with:
          path: |
            tests/data/*.tif
            data/grayscale/gray_3857-cog.tif
            data/viridis/output_cog.tif
          key: fixtures-${{ hashFiles('scripts/fetch-test-data.sh') }}
      - name: Fetch test fixtures
        run: scripts/fetch-test-data.sh
      - name: Run tests
        # Single-threaded: some tests assert on wall-clock latency against a local server and
        # flake on the 2-core runner when run in parallel.
        run: cargo test --workspace -- --nocapture --test-threads=1 2>&1 | tee out.txt
        shell: bash
      - name: Assert no tests were skipped
        run: "! grep -i skipping out.txt"

  doc:
    runs-on: ubuntu-24.04
    container: ghcr.io/osgeo/gdal:ubuntu-small-3.12.2
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Install build deps
        run: |
          apt-get update -o Acquire::Retries=3
          apt-get install -y --no-install-recommends -o Acquire::Retries=3 build-essential libclang-dev pkg-config git
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps
